<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doyzz Downloader - Permanen No Limit</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f0f0f;color:#fff;min-height:100vh}
.header{padding:16px;display:flex;justify-content:space-between;background:#121212;border-bottom:1px solid #222;position:sticky;top:0}
.logo{font-weight:800}.logo span{color:#ff3b5c}
.badge{background:#1e1e1e;border:1px solid #333;padding:6px 12px;border-radius:20px;font-size:11px;color:#00ff88}
.container{max-width:600px;margin:0 auto;padding:20px 16px}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:16px;padding:20px}
.input-wrap{background:#0f0f0f;border:1px solid #333;border-radius:12px;display:flex;padding:4px;margin-top:16px}
.input-wrap input{flex:1;background:transparent;border:none;color:#fff;padding:12px;outline:none}
.btn{background:#ff3b5c;color:#fff;border:none;padding:12px 18px;border-radius:10px;font-weight:700}
.platforms{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.plat{background:#222;border:1px solid #333;padding:5px 10px;border-radius:20px;font-size:11px}
.result{display:none;margin-top:20px}
.video-preview{width:100%;border-radius:12px;background:#000;max-height:450px}
.dl-btn{background:#222;border:1px solid #333;color:#fff;padding:14px;border-radius:10px;text-decoration:none;display:flex;justify-content:space-between;margin-top:10px;font-weight:600}
.dl-btn.primary{background:#ff3b5c;border-color:#ff3b5c}
.status{padding:10px;border-radius:10px;font-size:12px;margin-top:10px;display:none}
.status.ok{background:#152a1a;color:#4eff88;border:1px solid #224a2a}
.status.err
