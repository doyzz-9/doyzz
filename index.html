<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0d0d0d;color:#fff}
.topbar{background:#151515;border-bottom:1px solid #222;padding:12px 16px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}
.banner{margin:16px;border-radius:20px;background:linear-gradient(135deg,#ff3b5c,#7a1f3b);padding:22px}
