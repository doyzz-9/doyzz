<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOYZZ // Downloader</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #0b0c10;
    --card-bg: rgba(25, 27, 38, 0.65);
    --border-color: rgba(255, 255, 255, 0.08);
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
    --primary: #8b5cf6;
    --primary-hover: #7c3aed;
    --accent: #06b6d4;
    --error: #ef4444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
  
  body {
    min-height: 100vh;
    background: radial-gradient(circle at top left, #1f1b3d, var(--bg-color) 60%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: var(--text-main);
  }

  .glow {
    position: absolute;
    width: 300px;
    height: 300px;
    background: var(--primary);
    filter: blur(120px);
    opacity: 0.3;
    top: 10%;
    left: 20%;
    z-index: -1;
    border-radius: 50%;
  }

  .card {
    width: 100%;
    max-width: 600px;
    background: var(--card-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border-color);
    border-radius: 24px;
    padding: 32px;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.1);
    position: relative;
    overflow: hidden;
  }

  .header { text-align: center; margin-bottom: 28px; }
  .header h1 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(to right, var(--primary), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 8px;
  }
  .header p { font-size: 13px; color: var(--text-muted); }

  .input-group {
    display: flex;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 6px;
    transition: all 0.3s ease;
    position: relative;
  }
  .input-group:focus-within {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
  }

  .input-group input {
    flex: 1;
    background: transparent;
    border: none;
    padding: 12px 130px 12px 16px;
    color: white;
    font-size: 14px;
    outline: none;
    width: 100%;
  }
  .input-group input::placeholder { color: var(--text-muted); }

  .paste-btn {
    position: absolute;
    right: 105px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 8px;
    display: flex;
    align-items: center;
    transition: color 0.2s;
    z-index: 2;
  }
  .paste-btn:hover { color: var(--primary); }

  .btn-submit {
    position: absolute;
    right: 6px;
    top: 6px;
    bottom: 6px;
    background: linear-gradient(135deg, var(--primary), var(--primary-hover));
    border: none;
    border-radius: 12px;
    padding: 0 20px;
    color: white;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s ease;
    z-index: 2;
  }
  .btn-submit:hover:not(:disabled) {
    filter: brightness(1.1);
    transform: translateY(-1px);
  }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

  .loader-container {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 30px 0;
    gap: 12px;
  }
  .loader-container.show { display: flex; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid rgba(139, 92, 246, 0.2);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  .loader-text { font-size: 13px; color: var(--primary); font-weight: 600; text-align: center;}

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .alert {
    display: none;
    margin-top: 16px;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.2);
    color: var(--error);
    text-align: center;
  }
  .alert.show { display: block; animation: slideUp 0.3s ease; }

  .result-section {
    display: none;
    margin-top: 28px;
    animation: slideUp 0.4s ease;
  }
  .result-section.show { display: block; }

  .video-wrapper {
    border-radius: 16px;
    overflow: hidden;
    background: #000;
    border: 1px solid var(--border-color);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .bg-blur {
    position: absolute;
    inset: -20px;
    background-size: cover;
    background-position: center;
    filter: blur(20px) brightness(0.6);
    z-index: 0;
  }
  
  video { 
    width: 100%; 
    height: 450px; 
    display: block; 
    object-fit: contain; 
    background: transparent; 
    position: relative;
    z-index: 1; 
  }

  .desc-box {
    position: relative;
    z-index: 1; 
    padding: 16px;
    background: rgba(20, 20, 30, 0.85);
    border-top: 1px solid var(--border-color);
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-main);
    max-height: 120px;
    overflow-y: auto;
  }
  .desc-box::-webkit-scrollbar { width: 4px; }
  .desc-box::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

  .action-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
  }

  .btn-action {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.3s ease;
    border: none;
  }
  .btn-download {
    background: linear-gradient(135deg, #10b981, #059669);
    color: white;
    box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2);
  }
  .btn-download:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3); }
  
  .btn-share {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border-color);
    color: var(--text-main);
  }
  .btn-share:hover { background: rgba(255, 255, 255, 0.1); transform: translateY(-2px); }

  .watermark { text-align: center; margin-top: 24px; font-size: 11px; color: rgba(255,255,255,0.1); letter-spacing: 2px; }

  @media (max-width: 480px) {
    .card { padding: 20px; }
    .input-group input { padding: 12px 120px 12px 12px; font-size: 13px; }
    .paste-btn { right: 90px; }
    .btn-submit { padding: 0 15px; font-size: 13px; }
    video { height: 400px; }
  }
</style>
</head>
<body>

<div class="glow"></div>

<div class="card">
  <div class="header">
    <h1>DOYZZ // DL</h1>
    <p>Download video HD tanpa watermark</p>
  </div>

  <div class="input-group">
    <input id="url" type="text" placeholder="Tempel link TikTok/IG..." autocomplete="off">
    <button class="paste-btn" id="pasteBtn" title="Tempel dari clipboard">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
    </button>
    <button class="btn-submit" id="fetchBtn">Proses</button>
  </div>

  <div class="loader-container" id="loader">
    <div class="spinner"></div>
    <div class="loader-text" id="loadTxt">Memproses link...</div>
  </div>

  <div class="alert" id="alertBox"></div>

  <div class="result-section" id="result">
    <div class="video-wrapper">
      <div class="bg-blur" id="bgBlur"></div>
      <video id="player" controls playsinline></video>
      <div class="desc-box" id="desc"></div>
    </div>
    
    <div class="action-group">
      <!-- Tombol download diubah jadi button, bukan a href -->
      <button id="dlBtn" class="btn-action btn-download">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span id="dlBtnText">Download HD</span>
      </button>
      <button id="shareBtn" class="btn-action btn-share">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        Bagikan
      </button>
    </div>
  </div>

  <div class="watermark">SYSTEM OPERATIONAL V.1 // HELIOS</div>
</div>

<script>
const $ = id => document.getElementById(id);
const api = "https://www.tikwm.com/api/?url=";
let currentVideoUrl = ""; // Simpan URL video buat di-download

$("pasteBtn").addEventListener("click", async () => {
  try {
    const text = await navigator.clipboard.readText();
    if (text) {
      $("url").value = text.trim();
      $("alertBox").classList.remove("show");
    }
  } catch (err) {
    showAlert("Browser memblokir akses clipboard. Tempel manual.");
  }
});

function showAlert(msg) {
  $("alertBox").textContent = msg;
  $("alertBox").classList.add("show");
  setTimeout(() => $("alertBox").classList.remove("show"), 4000);
}

$("fetchBtn").addEventListener("click", async () => {
  const url = $("url").value.trim();
  if (!url) { showAlert("Link kosong, isi dulu."); return; }

  $("loader").classList.add("show");
  $("loadTxt").textContent = "Menghubungi server...";
  $("alertBox").classList.remove("show");
  $("result").classList.remove("show");
  $("fetchBtn").disabled = true;

  try {
    const res = await fetch(api + encodeURIComponent(url));
    if (!res.ok) throw new Error("Koneksi ke server gagal.");
    
    const data = await res.json();
    if (data.code !== 0) throw new Error(data.msg || "Link tidak valid atau server sibuk.");

    currentVideoUrl = data.data.play; 
    const videoDesc = data.data.title || "Tanpa deskripsi.";
    const videoCover = data.data.cover;

    if (!currentVideoUrl) throw new Error("URL Video tidak ditemukan.");

    $("desc").textContent = videoDesc;
    
    const player = $("player");
    player.src = currentVideoUrl; 

    if(videoCover) {
      $("bgBlur").style.backgroundImage = `url('${videoCover}')`;
    }
    
    $("loader").classList.remove("show");
    $("result").classList.add("show");

    // LOGIKA SHARE KE SEMUA APK HP
    $("shareBtn").onclick = async () => {
      const shareData = {
        title: 'Video TikTok HD',
        text: 'Cek video keren ini: ' + videoDesc,
        url: url 
      };

      try {
        if (navigator.share) {
          await navigator.share(shareData);
        } else {
          await navigator.clipboard.writeText(url);
          showAlert("Link disalin ke clipboard. Silakan tempel di chat/status.");
        }
      } catch (err) {
        if (err.name !== 'AbortError') {
          showAlert("Gagal membagikan link.");
        }
      }
    };

  } catch (err) {
    $("loader").classList.remove("show");
    showAlert(err.message || "Terjadi kesalahan sistem.");
  } finally {
    $("fetchBtn").disabled = false;
  }
});

// LOGIKA DOWNLOAD BLOB (LANGSUNG MASUK FOLDER DOWNLOAD)
$("dlBtn").addEventListener("click", async () => {
  if (!currentVideoUrl) return;
  
  const btnText = $("dlBtnText");
  const originalText = btnText.textContent;
  
  // Ubah tampilan tombol jadi loading
  btnText.textContent = "Mengunduh... (0%)";
  $("dlBtn").disabled = true;

  try {
    const response = await fetch(currentVideoUrl);
    if (!response.ok) throw new Error("Gagal mengambil file video.");

    // Baca total ukuran file untuk progress bar
    const contentLength = response.headers.get('content-length');
    const total = parseInt(contentLength, 10);
    let loaded = 0;

    const reader = response.body.getReader();
    const chunks = [];

    // Baca file per potongan (chunk)
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      loaded += value.length;
      
      if (total) {
        const percent = Math.round((loaded / total) * 100);
        btnText.textContent = `Mengunduh... (${percent}%)`;
      }
    }

    // Gabungkan semua potongan jadi file utuh
    const blob = new Blob(chunks, { type: 'video/mp4' });
    const blobUrl = URL.createObjectURL(blob);

    // Buat elemen <a> sementara untuk memicu download
    const a = document.createElement("a");
    a.href = blobUrl;
    a.download = `DOYZZ_${Date.now()}.mp4`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    
    // Bersihkan memori
    URL.revokeObjectURL(blobUrl);
    btnText.textContent = "Berhasil!";

    setTimeout(() => {
      btnText.textContent = originalText;
    }, 3000);

  } catch (err) {
    showAlert("Gagal download: " + err.message);
    btnText.textContent = originalText;
  } finally {
    $("dlBtn").disabled = false;
  }
});
</script>
</body>
</html>
