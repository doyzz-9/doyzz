<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JB Cash Flow Admin</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

  :root { 
    --bg-dark: #0a0a0f; 
    --surface-dark: #16161f; 
    --theme-blue: #007aff; 
    --theme-red: #ff3b30; 
    --text-main: #ffffff;
    --text-muted: #8e8e93;
    --ios-spring: cubic-bezier(0.25, 0.8, 0.25, 1); 
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-dark); color: var(--text-main); }
  
  /* PAGE TRANSITION */
  .page { display: none; min-height: 100vh; opacity: 0; }
  .page.active { display: block; animation: pageFadeIn 0.5s var(--ios-spring) forwards; }
  @keyframes pageFadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

  /* LOGIN */
  .login-container { height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 24px; background: radial-gradient(circle at top, #007aff15, var(--bg-dark) 50%); }
  .login-form { background: var(--surface-dark); border: 1px solid rgba(255,255,255,0.05); padding: 32px; border-radius: 28px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 20px; }
  .input-group input { width: 100%; padding: 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); font-size: 15px; background: rgba(255,255,255,0.03); color: #fff; outline: none; margin-top: 8px; transition: all 0.2s; font-family: inherit; }
  .input-group input:focus { border-color: var(--theme-blue); background: rgba(255,255,255,0.08); box-shadow: 0 0 15px rgba(0,122,255,0.2); }
  .btn-submit { padding: 16px; background: var(--theme-blue); color: #fff; border: none; border-radius: 16px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s var(--ios-spring); box-shadow: 0 8px 20px rgba(0,122,255,0.4); }
  .btn-submit:active { transform: scale(0.96); box-shadow: none; }
  
  /* DASHBOARD */
  .dashboard-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; background: rgba(10, 10, 15, 0.7); backdrop-filter: blur(24px); position: sticky; top: 0; z-index: 50; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .dashboard-content { padding: 24px; padding-bottom: 80px; }
  
  .form-card { background: var(--surface-dark); border: 1px solid rgba(255,255,255,0.05); padding: 24px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); margin-bottom: 28px; display: flex; flex-direction: column; gap: 16px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-card input, .form-card select, .form-card textarea { padding: 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); font-size: 14px; background: rgba(255,255,255,0.03); color: #fff; outline: none; font-family: inherit; transition: all 0.2s; }
  .form-card input:focus, .form-card select:focus, .form-card textarea:focus { border-color: var(--theme-blue); background: rgba(255,255,255,0.08); }
  .form-card select option { background: var(--surface-dark); color: #fff; }
  
  /* UPLOAD */
  .upload-area { border: 2px dashed rgba(255,255,255,0.2); border-radius: 16px; padding: 24px; text-align: center; cursor: pointer; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 10px; transition: all 0.2s; background: rgba(255,255,255,0.02); }
  .upload-area:hover { border-color: var(--theme-blue); color: var(--theme-blue); background: rgba(0,122,255,0.05); }
  .upload-area img { max-width: 100%; max-height: 160px; border-radius: 12px; margin-top: 12px; object-fit: cover; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
  
  /* LIST PRODUK & LOG */
  .admin-product-item { display: flex; align-items: center; gap: 16px; background: var(--surface-dark); border: 1px solid rgba(255,255,255,0.05); padding: 16px; border-radius: 20px; margin-bottom: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); animation: slideUp 0.3s ease; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .admin-product-item img { width: 70px; height: 70px; border-radius: 16px; object-fit: cover; border: 1px solid rgba(255,255,255,0.1); }
  .btn-delete { background: rgba(255,59,48,0.1); color: var(--theme-red); border: 1px solid rgba(255,59,48,0.2); width: 40px; height: 40px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.2s; }
  .btn-delete:active { transform: scale(0.9); background: rgba(255,59,48,0.2); }
  
  /* LOG STYLE */
  .log-container { background: var(--surface-dark); border: 1px solid rgba(255,255,255,0.05); padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
  .log-item { font-size: 14px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; color: #ddd; font-weight: 500; line-height: 1.4; }
  .log-item:last-child { border-bottom: none; padding-bottom: 0; }
  .log-item:first-child { padding-top: 0; }
  .log-text { flex: 1; }
  .log-time { font-size: 12px; color: var(--text-muted); font-weight: 600; white-space: nowrap; background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 6px; }
</style>
</head>
<body>

<div id="page-login" class="page active">
  <div class="login-container">
    <div class="login-form">
      <h2 style="text-align:center; font-size: 28px; letter-spacing: -1px; margin-bottom: 10px; color: #fff;">JB Cash Flow</h2>
      <div class="input-group"><input type="text" id="login-username" placeholder="Username"></div>
      <div class="input-group"><input type="password" id="login-password" placeholder="Password"></div>
      <button class="btn-submit" onclick="doLogin()" style="margin-top: 10px;">Masuk Dashboard</button>
    </div>
  </div>
</div>

<div id="page-dashboard" class="page">
  <div class="dashboard-header">
    <h2 style="font-size: 22px; letter-spacing: -0.5px; color: #fff;">Dashboard</h2>
    <button class="btn-delete" style="width:auto; padding: 8px 16px; font-weight: 700; font-size: 13px;" onclick="doLogout()">Keluar</button>
  </div>

  <div class="dashboard-content">
    <div style="display:flex; justify-content:space-between; align-items: center; margin-bottom: 20px;">
      <h3 style="font-size: 20px; letter-spacing: -0.5px; color: #fff;">Daftar Produk</h3>
      <button class="btn-submit" style="padding: 10px 20px; width:auto; font-size: 14px; border-radius: 12px;" onclick="toggleForm()"><i class="fa-solid fa-plus"></i> Tambah</button>
    </div>

    <div class="form-card" id="form-produk" style="display: none;">
      <input type="text" id="inp-nama" placeholder="Nama Produk (Cth: Akun FF Sultan)">
      <div class="form-row">
        <input type="number" id="inp-harga" placeholder="Harga Jual">
        <input type="number" id="inp-harga-coret" placeholder="Harga Coret">
      </div>
      <div class="form-row">
        <select id="inp-kategori">
          <option value="Free Fire">Free Fire</option>
          <option value="Mobile Legends">Mobile Legends</option>
          <option value="Flash Sale">Flash Sale</option>
          <option value="Pelajar">Pelajar</option>
        </select>
        <input type="text" id="inp-wa" placeholder="No WA (628...)">
      </div>
      <div class="upload-area" onclick="document.getElementById('inp-file').click()">
        <i class="fa-solid fa-cloud-arrow-up" style="font-size:28px;"></i>
        <span id="upload-text" style="font-weight: 600; font-size: 14px;">Pilih Foto dari Galeri</span>
        <img id="preview-img" style="display:none;">
      </div>
      <input type="file" id="inp-file" accept="image/*" style="display: none;" onchange="previewGambar(event)">
      <input type="text" id="inp-promo" placeholder="Label Promo (Cth: 50% OFF)">
      <button class="btn-submit" onclick="tambahProduk()" style="margin-top: 10px;">Simpan Produk</button>
    </div>

    <div id="admin-product-list"></div>

    <h3 style="margin-top:36px; margin-bottom:20px; font-size: 20px; letter-spacing: -0.5px; color: #fff;">Jejak Aktivitas</h3>
    <div id="log-list" class="log-container"></div>

    <h3 style="margin-top:36px; margin-bottom:20px; font-size: 20px; letter-spacing: -0.5px; color: #fff;">Pengaturan Bantuan</h3>
    <div class="form-card">
      <textarea id="bantuan-teks" style="min-height: 120px;"></textarea>
      <button class="btn-submit" onclick="simpanBantuan()">Simpan Bantuan</button>
    </div>
  </div>
</div>

<script>
  let token = localStorage.getItem('admin_token') || null;
  let base64Img = null;

  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  async function doLogin() {
    const u = document.getElementById('login-username').value;
    const p = document.getElementById('login-password').value;
    const res = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    const data = await res.json();
    if (data.success) {
      token = data.token;
      localStorage.setItem('admin_token', token);
      showPage('page-dashboard');
      loadDashboard();
    } else { alert(data.error); }
  }

  function doLogout() {
    localStorage.removeItem('admin_token');
    token = null;
    showPage('page-login');
  }

  function previewGambar(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('preview-img').src = e.target.result;
        document.getElementById('preview-img').style.display = 'block';
        document.getElementById('upload-text').innerText = "Ganti Foto";
        base64Img = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  }

  function toggleForm() {
    const form = document.getElementById('form-produk');
    form.style.display = form.style.display === 'none' ? 'flex' : 'none';
  }

  async function tambahProduk() {
    const payload = {
      name: document.getElementById('inp-nama').value,
      price: document.getElementById('inp-harga').value,
      old_price: document.getElementById('inp-harga-coret').value || null,
      kategori: document.getElementById('inp-kategori').value,
      wa: document.getElementById('inp-wa').value,
      image: base64Img || 'https://placehold.co/400x400/16161f/8e8e93?text=No+Img',
      promo: document.getElementById('inp-promo').value
    };

    if (!payload.name || !payload.price || !payload.wa) return alert("Lengkapi data terlebih dahulu!");

    await fetch('/api/products', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': token },
      body: JSON.stringify(payload)
    });

    base64Img = null;
    document.getElementById('inp-nama').value = '';
    document.getElementById('inp-harga').value = '';
    document.getElementById('inp-harga-coret').value = '';
    document.getElementById('inp-wa').value = '';
    document.getElementById('inp-promo').value = '';
    document.getElementById('preview-img').style.display = 'none';
    document.getElementById('upload-text').innerText = "Pilih Foto dari Galeri";
    toggleForm();
    loadDashboard();
  }

  async function hapusProduk(id) {
    if (!confirm("Hapus produk ini (Laku)?")) return;
    await fetch('/api/products/' + id, { method: 'DELETE', headers: { 'Authorization': token } });
    loadDashboard();
  }

  async function simpanBantuan() {
    const teks = document.getElementById('bantuan-teks').value;
    await fetch('/api/settings/bantuan', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': token },
      body: JSON.stringify({ bantuan: teks })
    });
    alert("Tersimpan!");
    loadDashboard();
  }

  async function loadDashboard() {
    const resP = await fetch('/api/products');
    const products = await resP.json();
    const pList = document.getElementById('admin-product-list');
    
    pList.innerHTML = products.length ? products.map(p => `
      <div class="admin-product-item">
        <img src="${p.image}">
        <div style="flex:1;">
          <h4 style="font-size:15px; font-weight:700; margin-bottom: 4px; line-height: 1.3; color: #fff;">${p.name}</h4>
          <div style="font-size:12px; color:var(--text-muted); font-weight: 600;">${p.kategori}</div>
          <div style="font-size:15px; color:var(--theme-blue); font-weight:800; margin-top:6px;">Rp ${p.price.toLocaleString('id-ID')}</div>
        </div>
        <button class="btn-delete" onclick="hapusProduk(${p.id})"><i class="fa-solid fa-check"></i></button>
      </div>
    `).join('') : '<p style="text-align:center; color:var(--text-muted); font-size:14px; font-weight:600; padding: 20px 0;">Belum ada produk.</p>';

    const resL = await fetch('/api/logs', { headers: { 'Authorization': token } });
    const logs = await resL.json();
    const lList = document.getElementById('log-list');

    lList.innerHTML = logs.length ? logs.map(l => `
      <div class="log-item">
        <div class="log-text">${l.message}</div>
        <div class="log-time">${l.created_at}</div>
      </div>
    `).join('') : '<p style="text-align:center; color:var(--text-muted); font-size:14px; font-weight:600; padding: 20px 0;">Belum ada log.</p>';

    const resB = await fetch('/api/settings/bantuan');
    const dataB = await resB.json();
    document.getElementById('bantuan-teks').value = dataB.bantuan;
  }

  if (token) {
    showPage('page-dashboard');
    loadDashboard();
  } else {
    showPage('page-login');
  }
</script>
</body>
</html>
